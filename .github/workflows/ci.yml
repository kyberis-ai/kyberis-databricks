name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 = Databricks Runtime 13.3 LTS notebooks; 3.11 = Databricks Apps.
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run --python ${{ matrix.python }} --group dev python -m pytest tests
